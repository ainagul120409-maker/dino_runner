<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dino Run</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#050605;color:#eee;font:12px "Courier New",monospace}.wrap{width:min(900px,100%)}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}.tag{color:#85877f;font-size:10px;letter-spacing:.18em}.title{font:950 clamp(32px,6vw,48px) Arial;margin:6px 0;letter-spacing:-.07em}.title i{color:#d8a64e;font-style:normal}.best{text-align:right;color:#888;font-size:10px}.best b{display:block;font:24px Arial;color:#eee;margin-top:4px}.card{padding:22px;background:#101110;border:1px solid #292b28}.hud{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.meter{width:min(340px,65%);font-weight:bold;font-size:10px;color:#888;letter-spacing:.1em}.meter label{display:flex;justify-content:space-between;margin-bottom:7px}.meter b{color:#d8a64e}.track{height:5px;background:#30322f}.fill{height:100%;width:18%;background:#d8a64e}.score{text-align:right}.score small{display:block;color:#888;font-size:9px;letter-spacing:.15em}.score b{font:26px Arial;letter-spacing:.05em}.stage{height:150px;position:relative;overflow:hidden;border:1px solid #252724;background:#080908;touch-action:manipulation;cursor:pointer}.stars{position:absolute;inset:0;opacity:.4;background-image:radial-gradient(#ddd 1px,transparent 1px),radial-gradient(#aaa 1px,transparent 1px);background-size:113px 71px,181px 117px;background-position:29px 22px,88px 42px}.moon{position:absolute;right:12%;top:12%;width:32px;height:32px;background:#eee;box-shadow:0 0 22px #eee5}.cloud{position:absolute;top:30%;width:65px;height:12px;background:#aaa;opacity:.18;animation:cloud 22s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit}.cloud:before{width:23px;height:9px;left:9px;top:-8px}.cloud:after{width:24px;height:12px;left:30px;top:-11px}.c2{top:48%;animation-duration:30s;animation-delay:-14s}@keyframes cloud{from{left:110%}to{left:-80px}}.ground{position:absolute;bottom:14px;height:2px;background:#87977c;width:100%}.ground:after{content:"";position:absolute;top:8px;height:7px;width:100%;background:repeating-linear-gradient(90deg,transparent 0 22px,#52624d 23px 30px,transparent 31px 55px);opacity:.4}.dino{position:absolute;z-index:2;left:10%;bottom:13px;width:74px;height:60px;filter:drop-shadow(0 5px 3px #0008)}.dino svg{width:100%;height:100%;overflow:visible}.dino.duck{height:44px;width:74px}.dino.jumping{transform:translateY(var(--jump-y,0px))}.dino.run #legA{animation:step .12s steps(2) infinite alternate;transform-origin:35px 65px}.dino.run #legB{animation:step .12s steps(2) infinite alternate-reverse;transform-origin:35px 65px}@keyframes step{to{transform:translate(3px,-2px)}}.obstacle{position:absolute;bottom:13px;z-index:2;height:43px}.group{height:100%;display:flex;align-items:end;gap:2px}.cactus{width:29px;height:43px;fill:#96734c}.small{height:32px;width:23px}.bird{position:absolute;z-index:2;width:43px;height:25px;color:#eee;bottom:50px;animation:flap .2s steps(2) infinite alternate}.bird.high{bottom:74px}@keyframes flap{to{transform:translateY(3px)}}.hint,.over{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:9px;background:#080908d9}.hint{background:transparent;color:#888;pointer-events:none}.hint b{color:#eee;font: bold 15px Arial;letter-spacing:.08em}.hint span{font-size:10px}.over{display:none;z-index:5}.over.show{display:grid}.over h2{font:bold 26px Arial;margin:0}.over p{color:#999}.button{padding:11px 18px;background:#d8a64e;border:1px solid #d8a64e;font:bold 12px "Courier New";cursor:pointer}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#888;font-size:10px;margin-top:12px}.key,.bottom button{padding:4px 7px;border:1px solid #393b37;border-bottom-width:2px;background:transparent;color:#ddd;font:inherit;font-size:9px}.bottom button{cursor:pointer}.bottom button:hover{color:#d8a64e;border-color:#d8a64e}.keys{display:flex;gap:5px;align-items:center}.tip{text-align:center}@media(max-width:560px){body{padding:12px}.card{padding:14px}.stage{height:150px}.tip{display:none}.bottom{font-size:9px}}
</style></head><body><main class="wrap"><header><div><div class="tag">NIGHT MARSH RUNNER</div><h1 class="title">DUCK <i>RUN</i></h1></div><div class="best">ЛУЧШИЙ РЕЗУЛЬТАТ<b id="best">00000</b></div></header><section class="card"><div class="hud"><div class="meter"><label><span>СКОРОСТЬ</span><b id="speed">1.0×</b></label><div class="track"><div class="fill" id="fill"></div></div></div><div class="score"><small>СЧЁТ</small><b id="score">00000</b></div></div><div class="stage" id="stage" tabindex="0"><div class="stars"></div><div class="moon"></div><div class="cloud"></div><div class="cloud c2"></div><div class="dino" id="dino"><svg viewBox="0 0 100 80" aria-label="Утка-кряква"><defs><linearGradient id="feathers" x2="0" y2="1"><stop stop-color="#e6bd76"/><stop offset=".48" stop-color="#9b6935"/><stop offset="1" stop-color="#543d29"/></linearGradient><linearGradient id="wing" x2="1" y2="1"><stop stop-color="#9b6035"/><stop offset="1" stop-color="#d1a05c"/></linearGradient><linearGradient id="head" x2="0" y2="1"><stop stop-color="#398c61"/><stop offset="1" stop-color="#123e32"/></linearGradient><linearGradient id="bill" x2="0" y2="1"><stop stop-color="#ffd76d"/><stop offset="1" stop-color="#dc882c"/></linearGradient></defs><g id="legA"><path fill="#c66d2e" d="M39 58h5v10l-5 4h13l-3-4v-9z"/><path fill="#e78c38" d="M35 71h11l4-2 3 2-2 3H35z"/></g><g id="legB"><path fill="#c66d2e" d="M62 57h5v11l-4 4h13l-3-4v-9z"/><path fill="#e78c38" d="M58 71h11l4-2 3 2-2 3H58z"/></g><path fill="url(#feathers)" d="M16 51 4 42l4 13 8 4c4 8 16 10 33 9 16 0 27-5 31-11 7 0 13-1 16-4-3-6-10-8-18-8-4-9-15-15-29-16-15-2-26 6-33 15z"/><path fill="url(#wing)" stroke="#634327" stroke-width="1.2" d="M23 49c7-12 22-15 34-10 8 3 12 9 11 15-3 9-23 13-37 8-7-2-11-7-8-13z"/><path fill="none" stroke="#edc17b" stroke-width="1.8" opacity=".7" d="M29 53c8 6 18 7 29 4M34 47c9 3 17 3 25 1"/><path fill="url(#head)" d="M56 41c3-6 8-11 8-18 0-10 7-17 16-17 10 0 17 7 17 16 0 10-7 17-17 17-4 5-6 10-7 14-5-5-10-9-17-12z"/><path fill="url(#bill)" d="M91 17c4 0 7 2 9 5-3 3-7 4-12 3l-5-2 2-5z"/><ellipse cx="84" cy="14" rx="3.3" ry="4" fill="#fff"/><circle cx="85" cy="14" r="2.2" fill="#111"/><circle cx="85.7" cy="13.2" r=".7" fill="#fff"/><path fill="#d8e7d2" opacity=".65" d="M69 11c5-5 12-6 17-3-5-1-9 1-12 5z"/></svg></div><div class="ground"></div><div class="hint" id="hint"><b>НАЖМИ, ЧТОБЫ НАЧАТЬ</b><span>ПРОБЕЛ / ↑ — ПРЫЖОК · ↓ — ПРИСЕСТЬ</span></div><div class="over" id="over"><h2>ЗАБЕГ ОКОНЧЕН</h2><p id="result"></p><button class="button" id="again">ЕЩЁ РАЗ ↻</button></div></div><footer class="bottom"><span class="keys"><kbd class="key">ПРОБЕЛ</kbd><kbd class="key">↑</kbd> прыжок <kbd class="key">↓</kbd> присесть</span><span class="tip">Беги как можно дальше!</span><span><button id="pause">Ⅱ ПАУЗА</button> <button id="sound">♪ ЗВУК</button></span></footer></section></main>
<script>(()=>{const $=s=>document.querySelector(s),stage=$('#stage'),dino=$('#dino'),scoreEl=$('#score'),bestEl=$('#best'),speedEl=$('#speed'),fill=$('#fill'),hint=$('#hint'),over=$('#over');let score=0,best=+(localStorage.dinoBest||0),playing=false,ended=false,paused=false,ducking=false,muted=true,speed=6,last=0,spawnIn=1300,raf=0,audio,jumpY=0,vy=0,jumping=false;const fmt=x=>String(Math.floor(x)).padStart(5,'0');bestEl.textContent=fmt(best);dino.addEventListener('animationend',e=>{if(e.animationName==='jump')dino.classList.remove('jump')});function beep(f=600){if(muted)return;try{audio??=new AudioContext();let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=f;g.gain.value=.04;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+.12)}catch{}}function start(){score=0;speed=6;spawnIn=1300;last=0;jumpY=0;vy=0;jumping=false;dino.style.removeProperty('--jump-y');playing=true;paused=false;ended=false;ducking=false;dino.className='dino run';hint.style.display='none';over.classList.remove('show');stage.querySelectorAll('.obstacle,.bird').forEach(e=>e.remove());$('#pause').textContent='Ⅱ ПАУЗА';raf=requestAnimationFrame(loop);beep()}function jump(){if(!playing){if(!ended)start();else return}if(paused||ducking||jumping)return;jumping=true;vy=-(10+speed/10);dino.classList.add('jumping');beep(760)}function duck(on){ducking=on&&playing&&!paused;dino.classList.toggle('duck',ducking);if(ducking)dino.classList.remove('jump')}function cactus(){let e=document.createElement('div');e.className='obstacle';let g=document.createElement('div');g.className='group';let n=score>750&&Math.random()<.33?3:Math.random()<.42?2:1;for(let i=0;i<n;i++){let s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 32 50');s.setAttribute('class','cactus'+(Math.random()<.3?' small':''));s.innerHTML='<path d="M2 48V31q0-8 8-8h12q8 0 8 8v17z"/><path fill="#d2aa70" d="M2 31h28v4H2zm8-6h3v20h-3z"/><path fill="#493724" d="M20 26h7v4h-7z"/>';g.append(s)}e.append(g);e.style.left=stage.clientWidth+'px';stage.append(e)}function bird(){let e=document.createElement('div');e.className='bird'+(Math.random()<.5?' high':'');e.innerHTML='<svg viewBox="0 0 48 26" width="100%" height="100%"><path fill="currentColor" d="M2 15h7l6-5 5 2 6-6 7 1 5 6h8v5h-9l-5 5h-7l3-7-8-2-5 7h-6l3-7H2z"/><circle cx="39" cy="13" r="1.5" fill="#080908"/></svg>';e.style.left=stage.clientWidth+'px';stage.append(e)}function hit(a,b){let x=a.getBoundingClientRect(),y=b.getBoundingClientRect();return x.right-8>y.left+4&&x.left+9<y.right-4&&x.bottom-5>y.top+5&&x.top+6<y.bottom-3}function loop(t){if(!playing||paused)return;let dt=Math.min(t-(last||t),40);last=t;const frames=dt/16.67;if(jumping){jumpY+=vy*frames;vy+=.6*frames;if(jumpY>=0){jumpY=0;vy=0;jumping=false;dino.classList.remove('jumping');dino.style.removeProperty('--jump-y')}else{dino.style.setProperty('--jump-y',jumpY+'px')}}score+=speed*frames/100;speed=Math.min(13,speed+.001*frames);scoreEl.textContent=fmt(score);speedEl.textContent=(speed/6).toFixed(1)+'×';fill.style.width=(18+(speed-6)/7*82)+'%';spawnIn-=dt;if(spawnIn<=0){if(score>450&&Math.random()<Math.min(.12,(score-450)/5000))bird();else cactus();spawnIn=(1000+Math.random()*800)*(6/speed)}for(let e of stage.querySelectorAll('.obstacle,.bird')){let x=parseFloat(e.style.left)-frames*speed*(e.classList.contains('bird')?1.18:1);e.style.left=x+'px';if(x< -70)e.remove();else if(hit(dino,e)){finish();return}}raf=requestAnimationFrame(loop)}function finish(){playing=false;ended=true;cancelAnimationFrame(raf);stage.querySelectorAll('.obstacle,.bird').forEach(e=>e.remove());if(score>best){best=Math.floor(score);localStorage.dinoBest=best;bestEl.textContent=fmt(best)}$('#result').textContent='Твой результат — '+fmt(score)+(score>=best?' · НОВЫЙ РЕКОРД!':'');over.classList.add('show');beep(150)}function pause(){if(!playing)return;paused=!paused;$('#pause').textContent=paused?'▶ ДАЛЕЕ':'Ⅱ ПАУЗА';if(paused){cancelAnimationFrame(raf);hint.innerHTML='<b>ПАУЗА</b><span>НАЖМИ P ИЛИ КНОПКУ ДЛЯ ПРОДОЛЖЕНИЯ</span>';hint.style.display='grid'}else{hint.style.display='none';last=0;raf=requestAnimationFrame(loop)}}document.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Space'||e.code==='ArrowUp'){if(ended){start();jump()}else jump()}if(e.code==='ArrowDown'||e.code==='KeyS')duck(true);if(e.code==='KeyP')pause();if(e.code==='KeyM'){muted=!muted;$('#sound').textContent=muted?'♪ ЗВУК':'♫ ЗВУК';beep()}});document.addEventListener('keyup',e=>{if(e.code==='ArrowDown'||e.code==='KeyS')duck(false)});stage.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;if(ended){start();jump()}else jump()});$('#again').onclick=start;$('#pause').onclick=pause;$('#sound').onclick=()=>{muted=!muted;$('#sound').textContent=muted?'♪ ЗВУК':'♫ ЗВУК';beep()};document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing&&!paused)pause()})})();</script></body></html>
